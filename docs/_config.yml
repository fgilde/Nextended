remote_theme: just-the-docs/just-the-docs@v0.10.0
title: Nextended
description: A comprehensive .NET library suite providing powerful extension methods, types, and utilities

# Color scheme (supports light, dark, or custom)
color_scheme: light

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Logo shown next to the site title. docs/assets/icon.png is a copy of the
# repository-root icon.png, kept in sync by tools/Update-PackageDocs.ps1.
logo: "/assets/icon.png"

# Aux links for the upper right navigation.
# The language pair is the site-wide switcher; individual pages additionally link
# to their counterpart in the other language at the top of the page.
aux_links:
  "🇬🇧 English":
    - "/Nextended/"
  "🇩🇪 Deutsch":
    - "/Nextended/de/"
  "GitHub":
    - "https://github.com/fgilde/Nextended"
  "NuGet":
    - "https://www.nuget.org/packages?q=Nextended"

aux_links_new_tab: false

# Footer content
footer_content: 'Copyright &copy; Nextended. Distributed under the <a href="https://github.com/fgilde/Nextended/blob/main/LICENSE">GPL-3.0-or-later License</a>.'

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# External navigation links
nav_external_links:
  - title: Nextended on GitHub
    url: https://github.com/fgilde/Nextended
    hide_icon: false

# Heading anchor links appear on hover
heading_anchors: true

# Callouts
callouts_level: loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
