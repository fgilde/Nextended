name: Deploy documentation to GitHub Pages

# The site is VitePress (docs/), not Jekyll. Two locales live in one build:
#   docs/     -> https://fgilde.github.io/Nextended/
#   docs/de/  -> https://fgilde.github.io/Nextended/de/
#
# The build fails on a dead internal link (ignoreDeadLinks is off in the config), so a broken
# cross-reference is caught here rather than shipped as a 404.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated in the theme reads git history; a shallow clone would date every page
          # to the last commit instead of the one that actually changed it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
