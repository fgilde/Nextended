<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="WebDataStudio demo">
  <!-- A deliberately different icon, so this demo shows what WithIcon does rather than claiming it:
       a light mark for the light theme this studio starts in. -->
  <defs>
    <linearGradient id="demoDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3c5"/>
      <stop offset="100%" stop-color="#2b8cff"/>
    </linearGradient>
    <linearGradient id="demoRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a24e"/>
      <stop offset="100%" stop-color="#a9761f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#f6f7fb" stroke="#dfe3ee" stroke-width="8"/>

  <!-- the disc stack, small and off-centre: the demo is a demo, not the product -->
  <g transform="translate(112,150)">
    <ellipse cx="72" cy="24" rx="72" ry="24" fill="url(#demoDisc)"/>
    <path d="M0 24v56a72 24 0 0 0 144 0V24a72 24 0 0 1-144 0z" fill="url(#demoDisc)" opacity="0.85"/>
    <path d="M0 88v56a72 24 0 0 0 144 0V88a72 24 0 0 1-144 0z" fill="url(#demoDisc)" opacity="0.7"/>
  </g>

  <!-- a ring around it, which is what makes it recognisable at 28 pixels in a header -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#demoRing)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="820 260" transform="rotate(-30 256 256)"/>

  <text x="330" y="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="132" font-weight="700" fill="#1f2328" text-anchor="middle">D</text>
</svg>
