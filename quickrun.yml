# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: Nextended
description: "A library monorepo with no single app to start, so this builds everything and runs the tests. The Aspire hosts under Tests/TestProjects are the runnable samples."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download
  - tool: pwsh
    install: https://github.com/PowerShell/PowerShell
    # Nextended.CodeGen runs UpdateGuid.ps1 through pwsh during the build, without ContinueOnError.

setup:
  - run: dotnet restore Nextended.sln
  - run: dotnet build Nextended.sln -c Release

tasks:
  - name: test
    run: dotnet test Nextended.sln -c Release --no-build
